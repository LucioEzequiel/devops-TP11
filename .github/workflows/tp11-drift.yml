name: TP11 - Deteccion de deriva en prod

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tp11-apply-prod
  cancel-in-progress: false

jobs:
  drift-prod:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_STATE_DIR: /var/lib/tf-state/devops-tp11
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Init (state de prod fuera del repo)
        run: terraform init -input=false -backend-config="path=${TF_STATE_DIR}/prod.tfstate"

      - name: Plan con deteccion de deriva
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=120s -var-file=envs/prod/terraform.tfvars > plan.txt 2>&1
          code=$?
          tail -n 30 plan.txt
          if [ "$code" -eq 2 ]; then
            echo "::error::Deriva detectada en prod: la infraestructura real no coincide con el codigo"
            exit 1
          fi
          exit "$code"
